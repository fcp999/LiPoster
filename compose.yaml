services:
  linkedin-publisher:
    build: .
    container_name: linkedin-publisher
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - linkedin-data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  linkedin-data:
